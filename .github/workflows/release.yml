name: Release Evidence
on: {workflow_dispatch: {}, push: {tags: ['v*']}}
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B clean verify package
      - run: sha256sum target/*.jar > target/SHA256SUMS.txt
      - uses: anchore/sbom-action@v0
        with: {path: '.', output-file: target/sbom.spdx.json}
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: target/*.jar}
      - uses: actions/upload-artifact@v4
        with: {name: release-evidence, path: 'target/*'}
